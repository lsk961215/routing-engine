plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lsk'
version = '0.0.1-SNAPSHOT'
description = 'routing'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://mvn.topobyte.de') }
    maven { url = uri('https://mvn.slimjars.com') }
}

dependencies {
    // 내부 모듈
    implementation project(':routing-core')

    // 스프링 부트
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Offline runner: each measured fork starts a fresh JVM; Spring is not started.
tasks.register('benchmarkAlgorithms', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lsk.routing.api.benchmark.AlgorithmBenchmark'
    maxHeapSize = '256m'
    doFirst {
        args = [
            rootProject.file(providers.gradleProperty('graph').getOrElse('data/processed/seoul.rgraph')).absolutePath,
            rootProject.file(providers.gradleProperty('queries').getOrElse('data/seoul-benchmark-queries.json')).absolutePath,
            rootProject.file(providers.gradleProperty('benchmarkReport').getOrElse('../.runtime/benchmarks/' + System.currentTimeMillis())).absolutePath,
            providers.gradleProperty('warmupRounds').getOrElse('4'),
            providers.gradleProperty('measuredRounds').getOrElse('20'),
            providers.gradleProperty('forks').getOrElse('3'),
            providers.gradleProperty('seed').getOrElse('20260926')
        ]
    }
}
