plugins {
    id 'java-library'
}

group = 'com.lsk'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://mvn.topobyte.de') }
    maven { url = uri('https://mvn.slimjars.com') }
}

dependencies {
    // OSM 데이터 모델
    implementation 'de.topobyte:osm4j-core:1.4.1'

    // OSM PBF Reader
    implementation 'de.topobyte:osm4j-pbf:1.4.1'

    // Test
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Paths supplied with -Ppbf are resolved relative to the backend directory.
tasks.register('analyzeOsm', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lsk.routing.core.osm.OsmAnalysis'
    maxHeapSize = '512m'
    doFirst {
        args = [rootProject.file(providers.gradleProperty('pbf')
                .getOrElse('data/processed/seoul-routing.osm.pbf')).absolutePath]
    }
}

// Strict offline builder; all paths are resolved relative to backend.
tasks.register('buildGraph', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.GraphBuilder'
    maxHeapSize = '2g'
    doFirst {
        args = [rootProject.file(providers.gradleProperty('pbf').get()).absolutePath,
                rootProject.file(providers.gradleProperty('graph').get()).absolutePath]
        if (providers.gradleProperty('comparison').getOrElse('false') == 'true') args += ['--comparison']
    }
}

tasks.register('routeGraph', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.DijkstraRouter'
    maxHeapSize = '512m'
    doFirst {
        args = [rootProject.file(providers.gradleProperty('graph').get()).absolutePath,
                providers.gradleProperty('start').get(), providers.gradleProperty('end').get()]
        if (providers.gradleProperty('snapshotAt').isPresent()) args += [providers.gradleProperty('snapshotAt').get()]
    }
}

// Diagnostic only. The old implementation is kept in test sources, not production artifacts.
tasks.register('benchmarkRouting', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.RoutingBenchmark'
    maxHeapSize = '512m'
    doFirst {
        args = providers.gradleProperty('graph').isPresent()
                ? [rootProject.file(providers.gradleProperty('graph').get()).absolutePath] : []
    }
}

// Offline validation of isolated relation extracts; no production dependency.
tasks.register('auditViaWays', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.ViaWayAudit'
    maxHeapSize = '512m'
    doFirst {
        args = [providers.gradleProperty('cases').get(), providers.gradleProperty('report').get()]
    }
}

tasks.register('auditRegions', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.RegionAudit'
    maxHeapSize = '512m'
    doFirst {
        args = [providers.gradleProperty('cases').get(), providers.gradleProperty('report').get()]
    }
}

tasks.register('benchmarkRegionCoordinates', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.RegionCoordinateBenchmark'
    maxHeapSize = '512m'
    doFirst {
        args = [providers.gradleProperty('graph').get(), providers.gradleProperty('queries').get()]
    }
}

tasks.register('inspectRegionFailures', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.RegionFailureAnalysis'
    maxHeapSize = '512m'
    doFirst {
        args = [providers.gradleProperty('cases').get(), providers.gradleProperty('report').get()]
    }
}

// Produces a comparison road subset and an explicit rule/exclusion audit.
tasks.register('prepareSeoul', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lsk.routing.core.graph.SeoulPreparation'
    maxHeapSize = '2g'
    doFirst {
        args = ['pbf', 'ids', 'report'].collect { rootProject.file(providers.gradleProperty(it).get()).absolutePath }
    }
}
